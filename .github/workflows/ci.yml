name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: Syntax PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '7.4', '8.1']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find billtoinvoices.php autoload.php src controllers lib -name '*.php' -print0 | xargs -0 -n1 php -l

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP 7.2 compatibility
        run: composer compat
      - name: Tests
        run: composer test

  build-zip:
    name: Module ZIP
    runs-on: ubuntu-latest
    needs: [syntax, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p build/billtoinvoices
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' --exclude='vendor' --exclude='bin' --exclude='build' \
            --exclude='composer.json' --exclude='composer.lock' --exclude='phpunit.xml' --exclude='.gitignore' \
            --exclude='README.md' --exclude='CHANGELOG.md' --exclude='DEVELOPMENT.md' --exclude='*.local.md' \
            ./ build/billtoinvoices/
          cd build && zip -rq billtoinvoices.zip billtoinvoices
      - uses: actions/upload-artifact@v4
        with:
          name: billtoinvoices
          path: build/billtoinvoices.zip
